[project]
name = "hybrid-pricing-agent"
version = "0.1.0"
description = "Hybrid pricing agent combining causal modeling, guarded recommendations and release-gated evaluations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricing_agent"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas>=3.0.6",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "statsmodels>=0.15.0",
]

[tool.coverage.report]
skip_empty = true

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "D",    # docstrings / pydocstyle
    "UP",   # pyupgrade
]
extend-select = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"
